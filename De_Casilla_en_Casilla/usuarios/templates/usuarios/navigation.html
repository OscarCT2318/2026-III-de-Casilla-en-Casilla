<nav class="navbar">
  <a class="brand" href="{% url 'home' %}">DE CASILLA EN CASILLA</a>
  <div class="nav-links">
    {% if request.session.game_configuration %}
      <a class="nav-link" href="{% url 'play' 'alpha' %}">Nivel Alfa</a>
      <a class="nav-link" href="{% url 'play' 'beta' %}">Nivel Beta</a>
    {% endif %}
    {% if request.user.is_authenticated %}
      <a class="nav-link" href="{% url 'perfil_usuario' %}">Mi perfil</a>
      {% if request.user.puede_acceder_panel %}
        <a class="nav-link" href="{% url 'panel_inicio' %}">Panel</a>
      {% endif %}
      <form method="post" action="{% url 'logout' %}" class="nav-logout-form">
        {% csrf_token %}
        <button type="submit" class="nav-link nav-button">Cerrar sesión</button>
      </form>
    {% else %}
      <a class="nav-link" href="{% url 'login' %}">Iniciar sesión</a>
      <a class="nav-link" href="{% url 'registro' %}">Registrarse</a>
    {% endif %}
  </div>
</nav>
