<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Permiso | Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #9cbded;">
    <div class="container mt-5" style="max-width: 500px;">
 <div class="card border-danger shadow-sm">
           <div class="card-header bg-danger text-white">
          <h5 class="mb-0">Confirmar Eliminación</h5>
      </div>
         <div class="card-body">
        <p class="mb-3">¿Estás seguro de que deseas eliminar el permiso: <strong>"{{ object.name }}"</strong> (<code>{{ object.codename }}</code>)?</p>
         <small class="text-muted d-block mb-3">Esta acción eliminará el registro de la base de datos de forma permanente.</small>
                
                <form method="post">
               {% csrf_token %}
            <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="{% url 'listar_permisos' %}" class="btn btn-secondary">Cancelar</a>
               <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
          </div>
        </form>
            </div>
        </div>
    </div>
</body>
</html>
