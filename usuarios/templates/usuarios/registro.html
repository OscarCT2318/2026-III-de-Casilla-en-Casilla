{% extends 'usuarios/base.html' %}

{% block title %}Registro | De Casilla en Casilla{% endblock %}

{% block content %}
<section class="account-page">
  <div class="account-card account-card-narrow glass-panel">
    <h1 class="account-center">Crear una cuenta</h1>
    <form method="post" class="account-form">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="account-actions">
        <button type="submit" class="btn-primary">Registrarme</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
