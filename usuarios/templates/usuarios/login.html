{% extends 'usuarios/base.html' %}

{% block title %}Iniciar Sesión | De Casilla en Casilla{% endblock %}

{% block content %}
<section class="account-page">
  <div class="account-card account-card-narrow glass-panel">
    <h1 class="account-center">Iniciar sesión</h1>
    <form method="post" class="account-form">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="account-actions">
        <button type="submit" class="btn-primary">Entrar al sistema</button>
      </div>
    </form>
    <p class="account-center">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a></p>
  </div>
</section>
{% endblock %}
